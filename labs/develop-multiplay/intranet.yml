---
- name: Enable intranet services
  hosts: node1.lab.example.com
  become: true
  tasks:
    - name: Install httpd and firewalld packages
      ansible.builtin.dnf:
        name:
          - httpd
          - firewalld
        state: present
    
    - name: Copy using inline content
      ansible.builtin.copy:
        content: 'Welcome to the example.com intranet!'
        dest: /var/www/html/index.html
        mode: '0644'
    
    - name: Firewall enable and running
      ansible.builtin.systemd_service:
        state: started
        enabled: true
        name: firewalld

    - name: Firewall permits access to httpd service
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true
    
    - name: Web server enable and running
      ansible.builtin.systemd_service:
        state: started
        enabled: true
        name: httpd

- name: Testintranet web server
  hosts: node2.lab.example.com
  become: false
  tasks:
    - name: Check that you can connect (GET) to a page and it returns a status 200
      ansible.builtin.uri:
        url: http://node1.lab.example.com
        status_code: 200
      register: results

    - name: Check that you can connect (GET) to a page and it returns a status 200
      ansible.builtin.debug:
        var: results
    



    