---
- name: Enable internet services
  hosts: web
  become: true
  tasks:
    - name: Install all required packages
      ansible.builtin.dnf:
        name:
          - httpd
          - php
          - firewalld
          - php-mysqlnd
        state: present
    
    - name: Firewalld enabled and running
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true

    - name: Firewalld permits http service # verificar task 6
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true
        
    - name: Httpd enabled and running
      ansible.builtin.systemd_service:
        name: httpd
        state: started
        enabled: true

    - name: Test php page is installed
      ansible.builtin.copy:
        src: index.php
        dest: /var/www/html/index.php # validar conteudo arquivo 
        mode: '0644'
        content: '# lab compreensive review #'

- name: test access to the web server
  hosts: node2.lab.example.com
  become: false
  tasks:
    - name: Connect to internet web server
      ansible.builtin.uri:
        url: node1.lab.example.com
        status_code: 200
      register: results
      failed_when: "'AWESOME' not in results.content"

    

